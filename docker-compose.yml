# ========================================
# 新顺电器仓库进销存管理系统 - Docker 部署
# ========================================

# 一、快速启动（推荐）
# ----------------------------------------
# 1. 复制环境变量文件并填写：
#    cp .env.example .env
#    编辑 .env 填入 Supabase 连接信息
#
# 2. 一键启动：
#    docker compose up -d
#
# 3. 访问系统：
#    http://localhost:5000
#
# 4. 停止服务：
#    docker compose down

# 二、单独构建并运行
# ----------------------------------------
# docker build -t wms-app .
# docker run -d -p 5000:5000 --env-file .env --name wms wms-app

# 三、注意事项
# ----------------------------------------
# - 本系统依赖 Supabase 云数据库，需确保网络可访问
# - 如需本地 Supabase，可取消 docker-compose.yml 中 supabase 服务的注释
# - 数据库连接信息在 .env 文件中配置
# - 首次构建较慢（需安装依赖），后续启动很快

services:
  wms:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wms-app
    ports:
      - "5000:5000"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/dashboard"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ========================================
  # 如需本地 Supabase 数据库，取消以下注释
  # 并将 .env 中的 Supabase URL 改为 http://supabase-db:5432
  # ========================================
  # supabase-db:
  #   image: supabase/postgres:15.6.1
