# 新顺电器仓库进销存管理系统 - Docker Compose 部署配置
#
# 使用方法：
#   1. 复制 .env.example 为 .env 并填写 Supabase 连接信息
#      cp .env.example .env
#      vim .env
#
#   2. 构建并启动
#      docker compose up -d --build
#
#   3. 查看日志
#      docker compose logs -f
#
#   4. 停止
#      docker compose down

services:
  web:
    build: .
    container_name: xinshun-erp
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - COZE_SUPABASE_URL=${COZE_SUPABASE_URL}
      - COZE_SUPABASE_ANON_KEY=${COZE_SUPABASE_ANON_KEY}
      - COZE_SUPABASE_SERVICE_ROLE_KEY=${COZE_SUPABASE_SERVICE_ROLE_KEY}
      - COZE_PROJECT_ENV=PROD
      - PORT=5000
    env_file:
      - .env
